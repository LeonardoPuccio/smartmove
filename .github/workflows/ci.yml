name: CI (lint → test → sonar)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --extra dev --frozen
      - name: Run ruff
        run: uv run ruff check .
      - name: Run black
        run: uv run black --check .
      - name: Run isort
        run: uv run isort . --check-only --profile black

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --extra dev --frozen
      - name: Run tests + coverage
        run: uv run pytest tests/test_unit.py tests/test_integration.py tests/test_cli.py --cov=. --cov-report=xml --cov-report=html --junitxml=test-results.xml -v
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
            test-results.xml

  sonar:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Download coverage reports
        uses: actions/download-artifact@v5
        with:
          name: coverage-reports
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
